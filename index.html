<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andre Lubas | Virtual Assistant & Lead Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#d6d2c8;--pink-soft:#e9e6df;--olive:#41606b;--olive-dark:#2c4651;--brown:#1f2a30;--white:#f6f5f1;
--display:'Bricolage Grotesque',Georgia,sans-serif;--body:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--brown);background:var(--white);line-height:1.6;font-size:1.05rem}
a{color:inherit}
:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.5rem}
h1,h2,h3{font-family:var(--display);line-height:1.05}
h2{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;margin-bottom:2rem}

/* nav */
nav{position:sticky;top:0;z-index:10;background:var(--white);border-bottom:2px solid var(--brown)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
nav b{font-family:var(--display);font-size:1.2rem}
nav ul{list-style:none;display:flex;gap:1.5rem;padding:0}
nav a{text-decoration:none;font-weight:600}
nav a:hover{color:var(--olive)}
@media(max-width:640px){nav ul{gap:.9rem;font-size:.9rem}nav b{display:none}}

/* hero */
.hero{background:var(--pink);border-bottom:2px solid var(--brown);overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center;min-height:82vh;padding-top:3rem;padding-bottom:3rem}
.hero h1{font-size:clamp(3rem,9vw,6.4rem);font-weight:800;letter-spacing:-.03em}
.hero h1 span{display:block;overflow:hidden}
.hero h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2) i{animation-delay:.15s;color:var(--olive-dark)}
@keyframes rise{to{transform:none}}
.role{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:1.5rem 0 .5rem;min-height:2.2rem}
.role::after{content:"";display:inline-block;width:3px;height:1.4rem;background:var(--brown);margin-left:4px;vertical-align:middle;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero p.lead{max-width:34rem;margin-bottom:1.8rem}
.btn{display:inline-block;padding:.85rem 1.6rem;border:2px solid var(--brown);border-radius:999px;font-weight:700;text-decoration:none;background:var(--brown);color:var(--white);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--olive)}
.btn.alt{background:transparent;color:var(--brown);margin-left:.6rem}
.photo{aspect-ratio:4/5;border:2px solid var(--brown);border-radius:999px 999px 24px 24px;background:var(--pink-soft);display:grid;place-items:center;text-align:center;font-weight:600;overflow:hidden;box-shadow:10px 10px 0 var(--olive)}
.photo img{width:100%;height:100%;object-fit:cover}
@keyframes morph{50%{border-radius:46% 54% 55% 45%/45% 55% 45% 55%}}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr;min-height:auto}.photo{max-width:280px}}

/* marquee */
.marquee{background:var(--olive);color:var(--white);overflow:hidden;border-bottom:2px solid var(--brown);white-space:nowrap;padding:.9rem 0}
.marquee div{display:inline-block;animation:slide 28s linear infinite;font-family:var(--display);font-weight:700;font-size:1.3rem}
.marquee span{margin:0 1.4rem}
@keyframes slide{to{transform:translateX(-50%)}}

section{padding:5rem 0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.facts{display:grid;gap:1rem;align-content:start}
.fact{border:2px solid var(--brown);border-radius:18px;padding:1rem 1.3rem;background:var(--pink-soft)}
.fact b{font-family:var(--display);font-size:2rem;display:block;color:var(--olive-dark)}

/* services */
.services{background:var(--pink-soft);border-block:2px solid var(--brown)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.4rem}
.card{background:var(--white);border:2px solid var(--brown);border-radius:20px;padding:1.5rem;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--olive)}
.card h3{font-size:1.4rem;margin-bottom:.5rem}
.card ul{padding-left:1.1rem;font-size:.97rem}

/* tools */
.tools-intro{max-width:46rem;margin-bottom:2rem}
.tools-intro p+p{margin-top:.8rem}
.logo-wall{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1.2rem}
.logo,.panel{background:#fff;border:2px solid var(--brown);border-radius:16px;display:grid;place-items:center;transition:transform .25s,box-shadow .25s}
.logo{padding:.8rem 1.2rem;height:84px}
.logo img{height:52px;width:auto;max-width:170px;object-fit:contain}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.panel{padding:1rem}
.panel img{width:100%;max-width:520px;height:auto}
.logo:hover,.panel:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--olive)}

/* samples + video */
.sample .thumb{aspect-ratio:16/10;border-radius:12px;background:var(--pink);border:2px solid var(--brown);margin-bottom:1rem;display:grid;place-items:center;font-weight:600;overflow:hidden}
.sample .thumb img{width:100%;height:100%;object-fit:cover}
.sample a{font-weight:700;color:var(--olive-dark)}
.video{background:var(--brown);color:var(--white)}
.video h2{color:var(--pink)}
.player{aspect-ratio:16/9;max-width:860px;border:3px solid var(--pink);border-radius:20px;overflow:hidden;background:#000;display:grid;place-items:center;text-align:center}
.player iframe,.player video{width:100%;height:100%;border:0}

/* testimonials */
.t-box{position:relative;max-width:760px}
.t{display:none;border:2px solid var(--brown);border-radius:24px;padding:2rem;background:var(--pink-soft);box-shadow:10px 10px 0 var(--olive)}
.t.on{display:block;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.t blockquote{font-family:var(--display);font-size:1.4rem;font-weight:500;line-height:1.35;margin-bottom:1rem}
.t cite{font-style:normal;font-weight:600}
.dots{display:flex;gap:.6rem;margin-top:2.2rem}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--brown);background:transparent;cursor:pointer;padding:0}
.dots button[aria-current=true]{background:var(--brown)}

/* contact */
.contact{background:var(--olive);color:var(--white)}
.contact h2{color:var(--pink)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.links a{border:2px solid var(--pink);border-radius:16px;padding:1.1rem 1.3rem;text-decoration:none;transition:background .2s,color .2s}
.links a:hover{background:var(--pink);color:var(--brown)}
.links small{display:block;opacity:.8}
.links b{font-size:1.1rem;word-break:break-all}
footer{padding:1.5rem;text-align:center;font-size:.9rem;background:var(--brown);color:var(--pink-soft)}

/* scroll reveal: one gentle entrance */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.hero h1 span i{transform:none}}
</style>
</head>
<body>

<nav><div class="wrap"><b id="navName"></b>
<ul><li><a href="#about">About</a></li><li><a href="#services">Services</a></li><li><a href="#tools">Tools</a></li><li><a href="#contact">Contact</a></li></ul></div></nav>

<header class="hero"><div class="wrap">
<div>
<h1><span><i id="firstName"></i></span><span><i id="lastName"></i></span></h1>
<div class="role" id="role" aria-live="off"></div>
<p class="lead" id="tagline"></p>
<a class="btn" href="#contact">Hire me</a><a class="btn alt" href="#services">See my services</a>
</div>
<div class="photo" id="photo">Add your photo<br>(photo.jpg)</div>
</div></header>

<div class="marquee" aria-hidden="true"><div id="marquee"></div></div>

<section id="about"><div class="wrap about">
<div class="reveal"><h2>About me</h2><div id="aboutText"></div></div>
<div class="facts reveal" id="facts"></div>
</div></section>

<section id="services" class="services"><div class="wrap">
<h2 class="reveal">What I can do for you</h2>
<div class="grid reveal" id="serviceGrid"></div>
</div></section>

<section id="tools"><div class="wrap">
<h2 class="reveal">Tools I use</h2>
<div class="tools-intro reveal" id="toolsIntro"></div>
<div class="logo-wall reveal" id="logoWall"></div>
<div class="panels reveal" id="panels"></div>
</div></section>

<section id="contact" class="contact"><div class="wrap">
<h2 class="reveal">Ready to help.</h2>
<div class="links reveal" id="links"></div>
</div></section>

<footer id="foot"></footer>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('navName').textContent = SITE.firstName + " " + SITE.lastName;
$('firstName').textContent = SITE.firstName;
$('lastName').textContent = SITE.lastName;
$('tagline').textContent = SITE.tagline;
$('aboutText').innerHTML = SITE.about.map(t => `<p style="margin-bottom:1rem">${esc(t)}</p>`).join('');
$('foot').textContent = "© " + new Date().getFullYear() + " " + SITE.firstName + " " + SITE.lastName;
document.title = SITE.firstName + " " + SITE.lastName + " | Virtual Assistant & Lead Generator";

// photo

// typing roles
(function(){
  const el = $('role'); let r = 0, c = 0, del = false;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = SITE.roles[0]; return; }
  (function tick(){
    const word = SITE.roles[r];
    el.textContent = word.slice(0, c);
    if (!del && c === word.length) { del = true; return setTimeout(tick, 1400); }
    if (del && c === 0) { del = false; r = (r + 1) % SITE.roles.length; }
    c += del ? -1 : 1;
    setTimeout(tick, del ? 40 : 80);
  })();
})();

// marquee (duplicated for seamless loop)

$('serviceGrid').innerHTML = SITE.services.map(s =>
  `<div class="card"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('');

$('toolsIntro').innerHTML = SITE.toolsIntro.map(t => `<p>${esc(t)}</p>`).join('');

// photo and logos (images live in the ASSETS block at the very bottom)
window.addEventListener('DOMContentLoaded', () => {
  const img = new Image(); img.alt = SITE.firstName + " " + SITE.lastName; img.src = ASSETS.photo;
  $('photo').innerHTML = ''; $('photo').appendChild(img);
  const nm = {canva:'Canva',claude:'Claude',whatsapp:'WhatsApp',threads:'Threads',tiktok:'TikTok',chatgpt:'ChatGPT',capcut:'CapCut',youtube:'YouTube',instagram:'Instagram',zoom:'Zoom',discord:'Discord',facebook:'Facebook',zoho:'Zoho',gemini:'Gemini',microsoft365:'Microsoft 365',googleworkspace:'Google Workspace'};
  $('logoWall').innerHTML = SITE.tools.map(k => `<div class="logo"><img src="${ASSETS.logos[k]}" alt="${nm[k]}"></div>`).join('');
  $('panels').innerHTML = SITE.toolPanels.map(k => `<div class="panel"><img src="${ASSETS.logos[k]}" alt="${nm[k]}"></div>`).join('');
});

$('links').innerHTML = SITE.contacts.map(c =>
  `<a href="${esc(c[2])}" target="_blank" rel="noopener"><small>${esc(c[0])}</small><b>${esc(c[1])}</b></a>`).join('');

// scroll reveal
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
